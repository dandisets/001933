dateCreated: '2026-07-27T09:19:31.794920+00:00'
description: 'Parkinson’s disease (PD) is defined pathologically by loss of dopamine-producing
  neurons in the substantia nigra pars compacta (SNc). Yet synaptic dysfunction emerges
  much earlier, making it essential to define the mechanisms that drive early nigrostriatal
  deregulation. In the SNc, molecularly distinct dopamine neuron subtypes show differential
  susceptibility to PD. In vivo fiber photometry of striatal dopamine release in awake,
  head-fixed mice expressing the dopamine sensor GRAB-DA3m. Two intersectional mouse
  lines targeting distinct dopamine neuron subtypes were studied: Anxa1-iCre mice
  (Anxa1+, vulnerable subtype) with fiber photometry in the dorsal lateral striatum
  (DLS), and Calb1-Cre mice (Calb1+, resilient subtype) with fiber photometry in the
  dorsal medial striatum (DMS). In each session, optogenetic activation of subtype-specific
  dopamine neuron cell bodies in the substantia nigra pars compacta (SNc) was achieved
  via Cre-dependent ChRmine expression and red-light (635 nm) stimulation. The experiment
  compares dopamine release between wild-type (LRRK2-WT) and LRRK2-G2019S knockin
  mice to investigate how pathogenic LRRK2 kinase activity affects dopamine synaptic
  function in a subtype-specific manner. This dandiset holds the fiber photometry
  and optogenetics recordings behind Figure 6 and Supplementary Figures 7 and 8 of
  the paper, from the 27 mice kept for analysis (15 Anxa1-iCre and 12 Calb1-Cre).
  Four other mice were excluded after post-hoc histological verification of virus
  expression and fiber placement and are not included: one Anxa1 LRRK2-G2019S mouse
  (abnormal GRAB-DA3m and ChRmine expression), one Calb1 LRRK2-G2019S mouse (off-target
  ChRmine expression) and two Calb1 LRRK2-WT mice (poor optic fiber placement). The
  proteomics, imaging and source data of the paper are deposited in PRIDE, the BioImage
  Archive and Zenodo, and are listed under related resources together with the analysis
  code.'
